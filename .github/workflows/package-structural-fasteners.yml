name: Package structural fasteners SCORM
on:
  push:
    branches: [course-build-structural-fasteners]
    paths:
      - '.course-build/structural-fasteners/**'
      - '.github/workflows/package-structural-fasteners.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: course-build-structural-fasteners
      - name: Package and verify original export files
        run: python3 .course-build/structural-fasteners/package.py
      - name: Save verified SCORM archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/Structural-Fasteners-SCORM12.zip
          git diff --cached --quiet && exit 0
          git commit -m 'Package verified structural fasteners SCORM archive'
          git push origin HEAD:course-build-structural-fasteners
