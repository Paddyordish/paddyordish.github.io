<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>How a pane takes shape | Patrick Ordish</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#f5f7f4;color:#203943;font-family:system-ui,sans-serif}button{font:inherit;cursor:pointer;border:1px solid #bacdc6;border-radius:8px;background:white;color:#203943;padding:10px 14px;min-height:42px}button:hover{background:#e2eee8}button:focus-visible,summary:focus-visible{outline:3px solid #bd813c;outline-offset:2px}button[aria-pressed=true]{background:#28665f;color:white;border-color:#28665f}button:disabled{opacity:.45;cursor:default}.app{height:100%;display:flex;flex-direction:column;max-width:1100px;margin:auto;padding:20px;gap:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:11px;letter-spacing:.12em;font-weight:750;color:#436b63}h1{font-size:24px;margin:4px 0}h2{font-size:23px;line-height:1.2;margin:0 0 10px}p{font-size:16px;line-height:1.55;margin:0 0 12px}.instruction{font-size:14px;color:#536963;margin:0}.stage{flex:1;min-height:0;background:white;border:1px solid #d3dfd8;border-radius:14px;overflow:auto;padding:20px;scrollbar-gutter:stable}.layout{display:grid;grid-template-columns:1.05fr 1fr;gap:24px;align-items:center;min-height:100%}.visual{min-width:0}.visual svg{width:100%;height:auto;max-height:280px;display:block}.visual img{width:100%;max-height:260px;object-fit:contain;display:block;border-radius:8px}.caption{font-size:11px;color:#5a6d66;margin-top:8px}.copy{min-width:0}.copy strong{color:#28665f}.nav{display:flex;align-items:center;gap:8px}.nav .progress{flex:1;min-width:0;font-size:13px;text-align:center;color:#436b63}.dots{display:flex;gap:5px}.dots span{height:4px;flex:1;border-radius:3px;background:#d4e0d9}.dots .seen{background:#28665f}.small{font-size:12px;color:#5b6e68}.question{margin-top:14px;padding-top:12px;border-top:1px solid #d6e0da}.answers{display:flex;gap:8px;flex-wrap:wrap}.feedback{padding:10px;background:#edf4ef;border-radius:6px;margin-top:10px;font-size:14px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}details{font-size:14px;line-height:1.5;margin-top:12px}summary{cursor:pointer;font-weight:650}details p{font-size:14px;margin:8px 0}.ribbon{stroke-dasharray:14 12;animation:flow 3s linear infinite}.running .blade{animation:cut 3s ease-in-out infinite}.running .sheetMarks{animation:flow 3s linear infinite}@keyframes flow{to{stroke-dashoffset:-52}}@keyframes cut{0%,100%{transform:translate(0,0)}50%{transform:translate(130px,35px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:650px){.app{padding:10px;gap:8px}h1{font-size:18px}h2{font-size:20px}.layout{grid-template-columns:1fr;gap:16px}.stage{padding:14px}.visual svg,.visual img{max-height:190px}.brand{font-size:10px}.instruction{font-size:12px}p{font-size:15px}}@media(max-height:360px){.app{padding:6px;gap:5px}.top .brand,.instruction{display:none}h1{font-size:14px;margin:0}.top button{font-size:11px;padding:3px 8px;min-height:26px}.stage{padding:10px}.layout{min-height:0}.visual{display:none}h2{font-size:16px;margin-bottom:6px}p{font-size:13px;line-height:1.4;margin-bottom:8px}.nav button{padding:4px 10px;min-height:30px;font-size:12px}.nav .progress{font-size:11px}.small,.caption{font-size:10px}.question{margin-top:6px;padding-top:6px}.answers button{font-size:12px;min-height:30px;padding:5px 8px}}</style></head><body><main class="app"><header class="top"><div><div class="brand">PATRICK ORDISH · FROM SAND TO SKYLINE</div><h1>How a pane takes shape</h1></div><button id="restart" aria-label="Restart this explainer">Restart</button></header><p class="instruction">Use Next to compare five production methods. Notice size, surface and continuity.</p><div class="dots" aria-hidden="true"></div><section class="stage" tabindex="-1" aria-label="Current explanation"><div class="layout"><div class="visual"></div><div class="copy"><p class="small" id="step"></p><h2 id="heading"></h2><div id="body"></div><p id="key"></p><div id="extra"></div></div></div></section><nav class="nav" aria-label="Explainer steps"><button id="prev">← Previous</button><span class="progress" aria-live="polite"></span><button id="next">Next →</button></nav></main><script>const panels=[{"title": "Crown glass", "body": "Developed in the 17th century in the UK, crown glass was made by blowing molten glass into a hollow sphere and spinning it rapidly into a circular sheet. The outer sections were cut into panes. The thicker centre, or bullseye, was discarded or used decoratively.", "visual": "<svg viewBox=\"0 0 560 310\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Conceptual illustration of the selected process\"><rect x=\"1\" y=\"1\" width=\"558\" height=\"308\" rx=\"16\" fill=\"#f3f6f2\"/><circle cx=\"180\" cy=\"140\" r=\"85\" fill=\"#bfe0d8\" stroke=\"#28665f\" stroke-width=\"3\"/><circle cx=\"180\" cy=\"140\" r=\"15\" fill=\"#28665f\"/><path d=\"M110 90h70v70h-70z M190 175h50v35h-50z\" fill=\"#ffffff88\" stroke=\"#28665f\" stroke-width=\"2\"/><path d=\"M290 140h80\" stroke=\"#28665f\" stroke-width=\"3\"/><text x=\"180\" y=\"270\" fill=\"#203943\" font-family=\"system-ui,sans-serif\" font-size=\"18\" text-anchor=\"middle\">Spun circular sheet</text><rect x=\"390\" y=\"100\" width=\"90\" height=\"90\" fill=\"#bfe0d8\" stroke=\"#28665f\" stroke-width=\"3\"/><text x=\"435\" y=\"230\" fill=\"#203943\" font-family=\"system-ui,sans-serif\" font-size=\"18\" text-anchor=\"middle\">Small pane</text></svg>", "key": "Small panes · inconsistent thickness · distortion", "extra": ""}, {"title": "The cylinder method", "body": "Molten glass is blown into a long, hollow cylinder. The cylinder is cut lengthwise, reheated and flattened into a rectangular sheet. This produces larger sheets than crown glass and remains relevant to decorative glass, stained glass and restoration.", "visual": "<svg viewBox=\"0 0 560 310\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Conceptual illustration of the selected process\"><rect x=\"1\" y=\"1\" width=\"558\" height=\"308\" rx=\"16\" fill=\"#f3f6f2\"/><path d=\"M80 100v100c0 40 150 40 150 0V100\" fill=\"#bfe0d8\" stroke=\"#28665f\" stroke-width=\"3\"/><ellipse cx=\"155\" cy=\"100\" rx=\"75\" ry=\"30\" fill=\"#e5f4ed\" stroke=\"#28665f\" stroke-width=\"3\"/><path d=\"M190 80v145\" stroke=\"#bd813c\" stroke-width=\"4\" stroke-dasharray=\"7 5\"/><path d=\"M270 160h65\" stroke=\"#28665f\" stroke-width=\"3\"/><rect x=\"370\" y=\"80\" width=\"140\" height=\"140\" fill=\"#bfe0d8\" stroke=\"#28665f\" stroke-width=\"3\"/><text x=\"155\" y=\"280\" fill=\"#203943\" font-family=\"system-ui,sans-serif\" font-size=\"18\" text-anchor=\"middle\">Blow · split · reheat</text><text x=\"440\" y=\"280\" fill=\"#203943\" font-family=\"system-ui,sans-serif\" font-size=\"18\" text-anchor=\"middle\">Flatten</text></svg>", "key": "A cylinder becomes a rectangular sheet", "extra": ""}, {"title": "Machine drawn cylinders", "body": "In the early 20th century, machines drew glass cylinders up to 40 feet high from a circular tank. After annealing, the cylinders were cut into sections typically 7 to 10 feet long, reheated and flattened.", "visual": "<svg viewBox=\"0 0 560 310\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Conceptual illustration of the selected process\"><rect x=\"1\" y=\"1\" width=\"558\" height=\"308\" rx=\"16\" fill=\"#f3f6f2\"/><rect x=\"140\" y=\"225\" width=\"280\" height=\"35\" rx=\"8\" fill=\"#dbdfd8\" stroke=\"#203943\"/><path d=\"M230 225V55Q280 20 330 55v170\" fill=\"#bfe0d8\" stroke=\"#28665f\" stroke-width=\"4\"/><path d=\"M190 190v-90m-10 15 10-15 10 15\" fill=\"none\" stroke=\"#bd813c\" stroke-width=\"4\"/><text x=\"280\" y=\"290\" fill=\"#203943\" font-family=\"system-ui,sans-serif\" font-size=\"18\" text-anchor=\"middle\">Mechanisation increases scale</text></svg>", "key": "From hand blowing to larger, more consistent sheets", "extra": ""}, {"title": "Stained and coloured glass", "body": "Silica, soda ash and lime are melted at high temperatures. Metal oxides create different colours. Glass is shaped by cylinder, crown or rolled methods, then annealed to reduce internal stresses. Cooled sheets are cut and assembled using lead cames or copper foil, then soldered into the finished design.", "visual": "<svg viewBox=\"0 0 560 310\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Conceptual illustration of the selected process\"><rect x=\"1\" y=\"1\" width=\"558\" height=\"308\" rx=\"16\" fill=\"#f3f6f2\"/><rect x=\"80\" y=\"35\" width=\"87\" height=\"77\" fill=\"#8ebdb0\" stroke=\"#203943\" stroke-width=\"3\"/><rect x=\"170\" y=\"35\" width=\"87\" height=\"77\" fill=\"#d8b070\" stroke=\"#203943\" stroke-width=\"3\"/><rect x=\"260\" y=\"35\" width=\"87\" height=\"77\" fill=\"#93a9bd\" stroke=\"#203943\" stroke-width=\"3\"/><rect x=\"350\" y=\"35\" width=\"87\" height=\"77\" fill=\"#d5dfce\" stroke=\"#203943\" stroke-width=\"3\"/><rect x=\"80\" y=\"115\" width=\"87\" height=\"77\" fill=\"#8ebdb0\" stroke=\"#203943\" stroke-width=\"3\"/><rect x=\"170\" y=\"115\" width=\"87\" height=\"77\" fill=\"#d8b070\" stroke=\"#203943\" stroke-width=\"3\"/><rect x=\"260\" y=\"115\" width=\"87\" height=\"77\" fill=\"#93a9bd\" stroke=\"#203943\" stroke-width=\"3\"/><rect x=\"350\" y=\"115\" width=\"87\" height=\"77\" fill=\"#d5dfce\" stroke=\"#203943\" stroke-width=\"3\"/><rect x=\"80\" y=\"195\" width=\"87\" height=\"77\" fill=\"#8ebdb0\" stroke=\"#203943\" stroke-width=\"3\"/><rect x=\"170\" y=\"195\" width=\"87\" height=\"77\" fill=\"#d8b070\" stroke=\"#203943\" stroke-width=\"3\"/><rect x=\"260\" y=\"195\" width=\"87\" height=\"77\" fill=\"#93a9bd\" stroke=\"#203943\" stroke-width=\"3\"/><rect x=\"350\" y=\"195\" width=\"87\" height=\"77\" fill=\"#d5dfce\" stroke=\"#203943\" stroke-width=\"3\"/><text x=\"280\" y=\"300\" fill=\"#203943\" font-family=\"system-ui,sans-serif\" font-size=\"16\" text-anchor=\"middle\">Coloured panes assembled into a design</text></svg>", "key": "Colour · shaping · annealing · assembly", "extra": ""}, {"title": "Towards continuous sheets", "body": "The Fourcault process (1902) and Colburn process (1913) introduced continuous sheet production, removing the need to blow or draw cylinders. They laid the groundwork for float glass.", "visual": "<img src=\"../media/source/44889_2.jpeg\" alt=\"Original course diagram of glass drawn vertically through a die and transported over rollers.\"><p class=\"caption\">Image from the original course material.</p>", "key": "A continuous ribbon replaces individual cylinders", "extra": "<div class=\"question\"><p>Which process produces a circular sheet?</p><div class=\"answers\"><button data-answer=\"correct\" data-feedback=\"Correct. Spinning produces the circular sheet; panes are cut from its outer sections.\" aria-pressed=\"false\">Crown</button><button data-answer=\"incorrect\" data-feedback=\"The cylinder method produces a rectangular sheet after splitting and flattening. Crown glass is spun into a circle.\" aria-pressed=\"false\">Cylinder</button></div><p class=\"feedback\" id=\"feedback\" aria-live=\"polite\" hidden></p></div>"}];let at=0;const seen=new Set();const $=s=>document.querySelector(s);function show(){seen.add(at);const p=panels[at];$('.visual').innerHTML=p.visual;$('#heading').textContent=p.title;$('#body').innerHTML='<p>'+p.body+'</p>';$('#key').innerHTML=p.key?'<strong>'+p.key+'</strong>':'';$('#extra').innerHTML=p.extra||'';$('#step').textContent='EXPLORE · '+String(at+1).padStart(2,'0');$('.progress').textContent=(at+1)+' / '+panels.length+(seen.size===panels.length?' · All explored':'');$('#prev').disabled=at===0;$('#next').disabled=at===panels.length-1;$('.dots').innerHTML=panels.map((_,i)=>'<span class="'+(seen.has(i)?'seen':'')+'"></span>').join('');$('.stage').scrollTop=0;document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{const f=$('#feedback');f.hidden=false;f.textContent=b.dataset.answer==='correct'?b.dataset.feedback:b.dataset.feedback;document.querySelectorAll('[data-answer]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));const motion=$('#motion');if(motion)motion.addEventListener('click',()=>{const on=$('.visual').classList.toggle('running');motion.textContent=on?'Pause movement':'Play movement';motion.setAttribute('aria-pressed',String(on))})}$('#next').addEventListener('click',()=>{at++;show()});$('#prev').addEventListener('click',()=>{at--;show()});$('#restart').addEventListener('click',()=>{at=0;seen.clear();show()});show();</script></body></html>
