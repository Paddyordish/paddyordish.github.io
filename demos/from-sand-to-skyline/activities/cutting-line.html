<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>From ribbon to sheet | Patrick Ordish</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#f5f7f4;color:#203943;font-family:system-ui,sans-serif}button{font:inherit;cursor:pointer;border:1px solid #bacdc6;border-radius:8px;background:white;color:#203943;padding:10px 14px;min-height:42px}button:hover{background:#e2eee8}button:focus-visible,summary:focus-visible{outline:3px solid #bd813c;outline-offset:2px}button[aria-pressed=true]{background:#28665f;color:white;border-color:#28665f}button:disabled{opacity:.45;cursor:default}.app{height:100%;display:flex;flex-direction:column;max-width:1100px;margin:auto;padding:20px;gap:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:11px;letter-spacing:.12em;font-weight:750;color:#436b63}h1{font-size:24px;margin:4px 0}h2{font-size:23px;line-height:1.2;margin:0 0 10px}p{font-size:16px;line-height:1.55;margin:0 0 12px}.instruction{font-size:14px;color:#536963;margin:0}.stage{flex:1;min-height:0;background:white;border:1px solid #d3dfd8;border-radius:14px;overflow:auto;padding:20px;scrollbar-gutter:stable}.layout{display:grid;grid-template-columns:1.05fr 1fr;gap:24px;align-items:center;min-height:100%}.visual{min-width:0}.visual svg{width:100%;height:auto;max-height:280px;display:block}.samples{display:grid;grid-template-columns:1fr 1fr;gap:12px}.samples figure{margin:0}.visual img{width:100%;max-height:260px;object-fit:contain;display:block;border-radius:8px}.caption{font-size:11px;color:#5a6d66;margin-top:8px}.copy{min-width:0}.copy strong{color:#28665f}.nav{display:flex;align-items:center;gap:8px}.nav .progress{flex:1;min-width:0;font-size:13px;text-align:center;color:#436b63}.dots{display:flex;gap:5px}.dots span{height:4px;flex:1;border-radius:3px;background:#d4e0d9}.dots .seen{background:#28665f}.small{font-size:12px;color:#5b6e68}.question{margin-top:14px;padding-top:12px;border-top:1px solid #d6e0da}.answers{display:flex;gap:8px;flex-wrap:wrap}.feedback{padding:10px;background:#edf4ef;border-radius:6px;margin-top:10px;font-size:14px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}details{font-size:14px;line-height:1.5;margin-top:12px}summary{cursor:pointer;font-weight:650}details p{font-size:14px;margin:8px 0}#visual-toggle{display:none}.ribbon{stroke-dasharray:14 12;animation:flow 3s linear infinite}.running .blade{animation:cut 3s linear infinite}.running .sheetFlow{animation:feed 3s linear infinite}@keyframes flow{to{stroke-dashoffset:-52}}@keyframes cut{from{transform:translate(0,0)}to{transform:translate(215px,53px)}}@keyframes feed{from{transform:translateY(0)}to{transform:translateY(53px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:650px){.app{padding:10px;gap:8px}h1{font-size:18px}h2{font-size:20px}.layout{grid-template-columns:1fr;gap:16px}.stage{padding:14px}.visual svg,.visual img{max-height:190px}.brand{font-size:10px}.instruction{font-size:12px}p{font-size:15px}}@media(max-height:360px){.app{padding:6px;gap:5px}.top .brand,.instruction{display:none}h1{font-size:14px;margin:0}#visual-toggle{display:block}.show-visual .visual{display:block}.top button{font-size:11px;padding:3px 8px;min-height:26px}.stage{padding:10px}.layout{min-height:0}.visual{display:none}h2{font-size:16px;margin-bottom:6px}p{font-size:13px;line-height:1.4;margin-bottom:8px}.nav button{padding:4px 10px;min-height:30px;font-size:12px}.nav .progress{font-size:11px}.small,.caption{font-size:10px}.question{margin-top:6px;padding-top:6px}.answers button{font-size:12px;min-height:30px;padding:5px 8px}}</style></head><body><main class="app"><header class="top"><div><div class="brand">PATRICK ORDISH · FROM SAND TO SKYLINE</div><h1>From ribbon to sheet</h1></div><button id="visual-toggle" aria-expanded="false">Show visual</button><button id="restart" aria-label="Restart this explainer">Restart</button></header><p class="instruction">Explore cutting, edge trimming and removal. Select Play movement to see a conceptual cutting cycle.</p><div class="dots" aria-hidden="true"></div><section class="stage" tabindex="-1" aria-label="Current explanation"><div class="layout"><div class="visual"></div><div class="copy"><p class="small" id="step"></p><h2 id="heading"></h2><div id="body"></div><p id="key"></p><div id="extra"></div></div></div></section><nav class="nav" aria-label="Explainer steps"><button id="prev">← Previous</button><span class="progress" aria-live="polite"></span><button id="next">Next →</button></nav></main><script>const panels=[{"title": "Coordinate the cut", "body": "The float process is continuous: the glass is always moving. The small angle of the cutting bridge helps create a clean, square and even break, reducing waste and improving efficiency.", "visual": "<svg viewBox=\"0 0 560 310\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Conceptual illustration of the selected process\"><rect x=\"1\" y=\"1\" width=\"558\" height=\"308\" rx=\"16\" fill=\"#f3f6f2\"/><defs><clipPath id=\"sheetClip\"><rect x=\"55\" y=\"50\" width=\"450\" height=\"205\" rx=\"8\"/></clipPath></defs><rect x=\"55\" y=\"50\" width=\"450\" height=\"205\" rx=\"8\" fill=\"#d6ece5\" stroke=\"#28665f\" stroke-width=\"2\"/><g clip-path=\"url(#sheetClip)\"><g class=\"sheetFlow\" stroke=\"#28665f\" stroke-width=\"2\" opacity=\".3\"><path d=\"M55 25h450\"/><path d=\"M55 78h450\"/><path d=\"M55 131h450\"/><path d=\"M55 184h450\"/><path d=\"M55 237h450\"/></g></g><path d=\"M135 72L350 125\" stroke=\"#203943\" stroke-width=\"12\"/><circle class=\"blade\" cx=\"135\" cy=\"72\" r=\"10\" fill=\"#bd813c\"/><path d=\"M475 85v100m-8-15 8 15 8-15\" fill=\"none\" stroke=\"#28665f\" stroke-width=\"3\"/><text x=\"280\" y=\"290\" fill=\"#203943\" font-family=\"system-ui,sans-serif\" font-size=\"17\" text-anchor=\"middle\">Moving ribbon · coordinated angled bridge</text></svg>", "key": "Schematic movement, not an engineering simulation", "extra": "<button id=\"motion\" aria-pressed=\"false\">Play movement</button><details><summary>See the original equipment</summary><img src=\"../media/source/44891_3.jpeg\" width=\"1600\" height=\"1248\" alt=\"Original course photograph showing cutting equipment above a glass conveyor.\"><p class=\"caption\">Image from the original course material. <a href=\"../media/source/44891_3.jpeg\" target=\"_blank\" rel=\"noopener\" style=\"color:#28665f\" aria-label=\"View this original image at full size in a new tab\">View full-size image ↗</a></p></details>"}, {"title": "Trim the edges", "body": "After cutting, each edge is trimmed to remove the teeth marks left by the annealing lehr driving wheels. This produces a smooth finish before transport.", "visual": "<svg viewBox=\"0 0 560 310\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Conceptual illustration of the selected process\"><rect x=\"1\" y=\"1\" width=\"558\" height=\"308\" rx=\"16\" fill=\"#f3f6f2\"/><rect x=\"75\" y=\"65\" width=\"410\" height=\"180\" fill=\"#bfe0d8\" stroke=\"#28665f\" stroke-width=\"2\"/><path d=\"M75 65v180m410-180v180\" stroke=\"#bd813c\" stroke-width=\"18\"/><path d=\"M105 65v180m350-180v180\" stroke=\"#203943\" stroke-width=\"2\" stroke-dasharray=\"8 5\"/><text x=\"280\" y=\"40\" fill=\"#203943\" font-family=\"system-ui,sans-serif\" font-size=\"18\" text-anchor=\"middle\">Trim the marked edges</text><text x=\"280\" y=\"285\" fill=\"#203943\" font-family=\"system-ui,sans-serif\" font-size=\"17\" text-anchor=\"middle\">Remove driving-wheel teeth marks</text></svg>", "key": "The edge finish is part of the process", "extra": ""}, {"title": "Leave the line", "body": "At the end of the float line, glass is automatically removed for packing and distribution or further processing in the factory.", "visual": "<img src=\"../media/source/44891_4.jpeg\" width=\"1600\" height=\"652\" alt=\"Original course photograph of the glass production and processing line.\"><p class=\"caption\">Image from the original course material. <a href=\"../media/source/44891_4.jpeg\" target=\"_blank\" rel=\"noopener\" style=\"color:#28665f\" aria-label=\"View this original image at full size in a new tab\">View full-size image ↗</a></p>", "key": "Automated removal supports the continuous flow", "extra": "<div class=\"question\"><p>Why coordinate cutting with the moving ribbon?</p><div class=\"answers\"><button data-answer=\"correct\" data-feedback=\"Correct. The angled bridge helps create a clean, square break while the ribbon continues moving.\" aria-pressed=\"false\">A square break, less waste</button><button data-answer=\"incorrect\" data-feedback=\"The source links the angled bridge to a square break and reduced waste. It does not change optical clarity.\" aria-pressed=\"false\">To change optical clarity</button></div><p class=\"feedback\" id=\"feedback\" aria-live=\"polite\" hidden></p></div>"}];let at=0;const seen=new Set();const $=s=>document.querySelector(s);function show(){seen.add(at);const p=panels[at];$('.visual').classList.remove('running');$('.visual').innerHTML=p.visual;$('#heading').textContent=p.title;$('#body').innerHTML='<p>'+p.body+'</p>';$('#key').innerHTML=p.key?'<strong>'+p.key+'</strong>':'';$('#extra').innerHTML=p.extra||'';$('#step').textContent='EXPLORE · '+String(at+1).padStart(2,'0');$('.progress').textContent=(at+1)+' / '+panels.length+(seen.size===panels.length?' · All explored':'');$('#prev').disabled=at===0;$('#next').disabled=at===panels.length-1;$('.dots').innerHTML=panels.map((_,i)=>'<span class="'+(seen.has(i)?'seen':'')+'"></span>').join('');$('.stage').scrollTop=0;document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{const f=$('#feedback');f.hidden=false;f.textContent=b.dataset.answer==='correct'?b.dataset.feedback:b.dataset.feedback;document.querySelectorAll('[data-answer]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));const motion=$('#motion');if(motion&&matchMedia('(prefers-reduced-motion: reduce)').matches){motion.disabled=true;motion.textContent='Reduced motion: static view';}if(motion)motion.addEventListener('click',()=>{const on=$('.visual').classList.toggle('running');motion.textContent=on?'Pause movement':'Play movement';motion.setAttribute('aria-pressed',String(on))})}$('#visual-toggle').addEventListener('click',()=>{const on=$('.stage').classList.toggle('show-visual');$('#visual-toggle').setAttribute('aria-expanded',String(on));$('#visual-toggle').textContent=on?'Hide visual':'Show visual';$('.stage').scrollTop=0;});$('#next').addEventListener('click',()=>{at++;show()});$('#prev').addEventListener('click',()=>{at--;show()});$('#restart').addEventListener('click',()=>{at=0;seen.clear();show()});show();</script></body></html>
